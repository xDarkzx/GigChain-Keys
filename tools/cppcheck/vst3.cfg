<?xml version="1.0"?>
<!-- The VST3 SDK's macros cppcheck cannot see through (the SDK is a system
     include for the build). Without these it refuses to analyse the file. -->
<def format="2">
  <define name="QUERY_INTERFACE(iid, obj, InterfaceIID, ClassName)" value="if (iid == nullptr) {}"/>
  <define name="PLUGIN_API" value=""/>
  <!-- Qt's headers are system includes too: without this, every file that
       includes its .moc stops at the moc's "doesn't include <QObject>" guard.
       69 is the moc revision of Qt 6.10.2 (the guard says which it wants). -->
  <define name="Q_MOC_OUTPUT_REVISION" value="69"/>
  <!-- Qt Test: records the test's source folder; nothing to analyse. -->
  <define name="QTEST_SET_MAIN_SOURCE_PATH" value=""/>
</def>
