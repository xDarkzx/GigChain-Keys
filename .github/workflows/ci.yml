name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # OpenStage is Windows-first (WASAPI/ASIO, VST3 HWND editors).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\..\vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          arch: win64_msvc2022_64
          cache: true

      # The same vcpkg commit as vcpkg.json's builtin-baseline, so CI builds
      # exactly the library versions developers build.
      - name: Get vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout --quiet $baseline
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "${{ github.workspace }}\..\vcpkg-cache" | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\vcpkg-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      # Configure, build (/W4 /WX: warnings fail the build) and run every
      # test. Tests needing an audio device, MIDI keyboard or installed
      # plugins skip themselves on the runner.
      - name: Build and test
        shell: pwsh
        run: .\tools\build.ps1 -Preset ${{ matrix.preset }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/tests/**/*.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
