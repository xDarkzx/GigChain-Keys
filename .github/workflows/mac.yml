name: Mac

# Only when started by hand (Actions → Mac → Run workflow) or on a release
# tag: Mac minutes count ten times on a private repo. (GitHub offers "Run
# workflow" once this file is on the default branch.)
"on":
  workflow_dispatch:
  push:
    tags: ["v*"]

# Reads the code only (caches and artifacts use their own tokens).
permissions:
  contents: read

jobs:
  mac:
    # Apple Silicon, and Intel (#79): each built, tested and packaged on its
    # own kind of Mac. One failing does not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            preset: mac-release
          - arch: x86_64
            runner: macos-15-intel
            preset: mac-intel-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/../vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.2"
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      # pkg-config: vcpkg checks the libraries' .pc files with it, and on the
      # Mac it only looks for Homebrew's (it does not download one).
      - name: Tools
        run: brew install ninja pkg-config

      # The same vcpkg commit as vcpkg.json's builtin-baseline.
      - name: Get vcpkg
        run: |
          baseline=$(python3 -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git clone --quiet https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "${{ github.workspace }}/../vcpkg-cache"

      # Restored and saved separately: saved even when the build fails, so a
      # second attempt skips the libraries. The Xcode version is in the key
      # (RtAudio's exported target records Xcode's framework paths).
      - name: Restore the library cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-mac-${{ matrix.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}
          restore-keys: vcpkg-mac-${{ matrix.arch }}-${{ steps.xcode.outputs.version }}-

      # Piano Pro's samples (cmake/PianoSamples.cmake downloads them, ~650 MB, once).
      - name: Piano samples
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../piano-samples
          key: piano-samples-2e91c9aa7b16d936f035963149df1fe4cbd65911116fb3e3ea6daca52e92024b

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # -k 0: every file that fails is reported in one run, not only the first.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Save the library cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/../vcpkg-cache
          key: vcpkg-mac-${{ matrix.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}

      - name: Test plugins
        run: brew install --cask surge-xt

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        run: |
          version=$(sed -nE 's/^set\(PRODUCT_VERSION "([^"]+)"\).*/\1/p' branding.cmake)
          bash tools/package-mac.sh build/${{ matrix.preset }} "$version" ${{ matrix.arch }}

      - name: Upload the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: GigChain-Keys-mac-${{ matrix.arch }}
          path: build/${{ matrix.preset }}/*.dmg
          if-no-files-found: error

      # Always: which tests ran and which skipped (ctest prints only failures).
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-logs-${{ matrix.arch }}
          path: |
            build/${{ matrix.preset }}/tests/**/*.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
